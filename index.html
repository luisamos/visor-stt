<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="./imgs/casa1.png" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor de Mapas - STT</title>
</head>
<body>

  <!-- LOADER -->
  <div id="app-loader">
    <div class="loader-card">
      <img src="./imgs/casa2.png" alt="Logo" class="loader-logo" />
      <h2 class="loader-title">Visor de Mapas</h2>
      <div class="loader-spinner">
        <div class="spinner-track"></div>
        <div class="spinner-head"></div>
      </div>
      <p class="loader-msg">Iniciando...</p>
    </div>
  </div>

  <!-- NAVBAR -->
  <nav id="main-navbar">
    <div class="nav-left">
      <button id="toggleSidebar" title="Mostrar/Ocultar panel de capas">
        <i class="bi bi-layout-sidebar-reverse"></i>
      </button>
      <div class="brand">
        <img src="./imgs/casa2.png" alt="Logo" />
        <div class="brand-text">
          <span class="brand-name">Visor de Mapas</span>
          <span class="brand-sub">Sistema de Tenencia de Tierras</span>
        </div>
      </div>
    </div>

    <div class="nav-tools">
      <!-- Navegación -->
      <button id="controlVistaGeneral" class="tool-btn" title="Vista general"><i class="bi bi-house-door"></i></button>
      <button id="controlMas"          class="tool-btn" title="Acercarse"><i class="bi bi-zoom-in"></i></button>
      <button id="controlMenos"        class="tool-btn" title="Alejarse"><i class="bi bi-zoom-out"></i></button>
      <span class="tool-sep"></span>
      <!-- Herramientas -->
      <button data-panel="panel1" class="tool-btn" title="Buscar por Centro Poblado"><i class="bi bi-search"></i></button>
      <button data-panel="panel2" class="tool-btn" title="Cargar archivo SHP / KML"><i class="bi bi-upload"></i></button>
      <button data-panel="panel3" class="tool-btn" title="Ubicar coordenadas"><span class="img-svg-uc"></span></button>
      <button id="obtenerInformacion" class="tool-btn" title="Obtener información del mapa"><i class="bi bi-info-circle"></i></button>
      <span class="tool-sep"></span>
      <!-- Dibujo y medición -->
      <button id="dibujarPoligono"  class="tool-btn" title="Dibujar polígono"><i class="bi bi-hexagon"></i></button>
      <button id="dibujarLinea"     class="tool-btn" title="Dibujar línea"><i class="bi bi-pencil"></i></button>
      <button id="medirArea"        class="tool-btn" title="Medir área"><i class="bi bi-bounding-box"></i></button>
      <button id="medirPerimetro"   class="tool-btn" title="Medir perímetro / longitud"><i class="bi bi-rulers"></i></button>
      <button id="limpiarDibujos"   class="tool-btn" title="Eliminar dibujos y medidas"><i class="bi bi-eraser"></i></button>
      <span class="tool-sep"></span>
      <!-- Imprimir -->
      <button id="btnImprimir" class="tool-btn" title="Imprimir mapa"><i class="bi bi-printer"></i></button>
    </div>
  </nav>

  <!-- SIDEBAR DE CAPAS (overlay sobre el mapa) -->
  <aside id="layers-sidebar">
    <div class="sidebar-heading">
      <i class="bi bi-stack"></i>
      <span>Control de Capas</span>
    </div>
    <div id="panel-capas-contenido" class="sidebar-layers"></div>
  </aside>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- POPUP -->
  <div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
    <div id="popup-content"></div>
  </div>

  <!-- STATUS BAR -->
  <div id="mouse-position">
    <div id="proyeccion">
      <strong>Proyeccion:</strong>
      <select id="srid">
        <option value="32717">WGS84 - Zona 17S</option>
        <option value="32718">WGS84 - Zona 18S</option>
        <option value="32719" selected>WGS84 - Zona 19S</option>
        <option value="4326">WGS84</option>
      </select>
    </div>
    <div id="coordenadas"></div>
    <div id="scale"><strong>| Escala:</strong></div>
  </div>

  <!-- PANEL 1: Buscar Centro Poblado -->
  <div id="panel1" class="side-panel card" style="display:none;">
    <div class="panel-header d-flex justify-content-between align-items-center px-3 py-2">
      <p class="mb-0"><i class="bi bi-search me-1"></i> Buscar Centro Poblado</p>
      <button class="btn-close btn-close-white" data-close="panel1" aria-label="Cerrar"></button>
    </div>
    <div class="card-body p-3">
      <div class="mb-3">
        <label for="txtBuscar" class="form-label">Buscar:</label>
        <input type="text" class="form-control" id="txtBuscar" placeholder="Digite un lugar..." maxlength="100">
      </div>
      <div id="mensajeConsulta" class="table-container"></div>
      <hr class="my-2" />
      <div id="resultado"></div>
    </div>
  </div>

  <!-- PANEL 2: Cargar Archivo -->
  <div id="panel2" class="side-panel card" style="display:none;">
    <div class="panel-header d-flex justify-content-between align-items-center px-3 py-2">
      <p class="mb-0"><i class="bi bi-upload me-1"></i> Cargar Archivo</p>
      <button class="btn-close btn-close-white" data-close="panel2" aria-label="Cerrar"></button>
    </div>
    <div class="card-body p-3">
      <div class="mb-3">
        <label for="archivoZipKmlKmz" class="form-label">Archivo Shape (.zip), KML o KMZ</label>
        <input class="form-control" type="file" id="archivoZipKmlKmz" />
      </div>
      <div id="mensajeCargar"></div>
      <hr class="my-2" />
      <div class="d-flex gap-2">
        <button id="subirArchivo"  class="btn btn-sm btn-outline-primary"><i class="bi bi-box-arrow-up"></i> Subir</button>
        <button id="limpiarArchivo" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Limpiar</button>
      </div>
    </div>
  </div>

  <!-- PANEL 3: Ubicar Coordenadas -->
  <div id="panel3" class="side-panel card" style="display:none;">
    <div class="panel-header d-flex justify-content-between align-items-center px-3 py-2">
      <p class="mb-0"><i class="bi bi-crosshair me-1"></i> Ubicar Coordenadas</p>
      <button class="btn-close btn-close-white" data-close="panel3" aria-label="Cerrar"></button>
    </div>
    <div class="card-body p-3">
      <div class="mb-2">
        <label class="form-label form-label-sm">Sistema de referencia:</label>
        <select id="sistemaReferencia" class="form-select form-select-sm">
          <option value="4326" selected>WGS84 (decimales)</option>
          <option value="32717">UTM 17S</option>
          <option value="32718">UTM 18S</option>
          <option value="32719">UTM 19S</option>
        </select>
      </div>
      <div class="mb-2">
        <label id="labelX" class="form-label form-label-sm">Longitud:</label>
        <input type="text" class="form-control form-control-sm" id="coordenadaX">
      </div>
      <div class="mb-2">
        <label id="labelY" class="form-label form-label-sm">Latitud:</label>
        <input type="text" class="form-control form-control-sm" id="coordenadaY">
      </div>
      <div id="mensajeUbicarCoordenadas"></div>
      <hr class="my-2" />
      <div class="d-flex gap-2 justify-content-end">
        <button id="ubicarCoordenadas"  class="btn btn-sm btn-outline-primary"><i class="bi bi-crosshair"></i> Ir</button>
        <button id="limpiarCoordenadas" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Limpiar</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
